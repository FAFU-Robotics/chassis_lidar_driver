# ============================================================
# 车侧代理配置文件  agent.conf   （KEY=VALUE，# 开头为注释）
#
# 参数优先级: 命令行参数 > 环境变量 > 本文件 > 内置默认值
# 日常请用仓库根目录 python3 run_local.py（--local，不连 WebSocket）。
# 云端模式已废弃：不要再开 mock_cloud / start_agent.sh 去连下面这个地址。
#   python3 run_agent.py --local --config agent.conf
# ============================================================

# 已废弃的 WebSocket 地址（仅旧入口读取；本地模式会忽略）
BUNKER_WS_URL=ws://127.0.0.1:9000

# 设备号与绑定码（甲方接入后换成甲方签发的值）
BUNKER_DEVICE_ID=BUNKER-TEST01
BUNKER_BIND_CODE=TEST-BIND-xxxx

# CAN 接口：Jetson/Linux 用 socketcan；candleLight 用 gs_usb（留空自动检测）
# Jetson 上 USB-CAN 适配器通常为 can1（can0 是板载 mttcan）。
# 留空时自动检测：先 probe「能收到底盘反馈(0x211)」的口，其次 USB-CAN，最后 can0。
# BUNKER_INTERFACE=socketcan
# BUNKER_CHANNEL=can1
#
# 一键启用 CAN 网卡:
#   bash bringup_gs_usb_can.sh     # gs_usb 内核模块 + can1（推荐）
#   或
#   bash bringup_can0.sh           # 板载 mttcan can0
#
# USB-CAN 插上却一直 DOWN / 小车不动？先跑一键诊断修复（需 root）:
#   sudo bash fix_candle_usb.sh

# 轨迹文件保存目录（默认 ./tracks；现场建议绝对路径）
BUNKER_TRACK_DIR=./tracks

# 日志级别: DEBUG / INFO / WARNING / ERROR
BUNKER_LOG_LEVEL=INFO
# 日志文件路径，留空只输出到控制台（现场建议填 agent.log 便于排障）
BUNKER_LOG_FILE=agent.log

# 低延迟 TCP 遥操（笔记本 HID → 工控机 :9100，不走 SSH/WebSocket）
# BUNKER_TELEOP_TCP=1
# BUNKER_TELEOP_HOST=0.0.0.0
# BUNKER_TELEOP_PORT=9100
# BUNKER_TELEOP_TOKEN=bunker-teleop

# ============================================================
# 激光雷达（RoboSense Airy）避障 / 导航
# ============================================================

# 是否启用雷达避障/导航（1=启用, 0=关闭）。关闭后 move/回放不带避障保护
BUNKER_ENABLE_LIDAR=1

# 雷达 MSOP UDP 端口（出厂默认 6699；改过端口按实际值填）
# BUNKER_LIDAR_PORT=6699

# 雷达 0° 相对车头方向的偏置角（度，左转为正）。
# 雷达装好后用 view_lidar.py 校准：让车头正前方障碍出现在 0° 扇区
# BUNKER_LIDAR_MOUNT_YAW=0

# 雷达安装俯仰角（度，正=抬头）。Airy 立装时用来补偿安装倾角
# BUNKER_LIDAR_PITCH_DEG=0

# 雷达光心离地高度（米）。点云 z 平移为「离地高度」，
# 地形通过性与视觉目标高度判定因此更准确
# BUNKER_LIDAR_HEIGHT_M=0

# 自扫硬件过滤（1=开启, 0=关闭）。剔除雷达安装支架区域的固定点，
# 避免支架在扇区图/地形里形成固定误检（默认开启）
# BUNKER_LIDAR_SELF_MASK=1

# 离线回放：填 PCAP 抓包文件路径后，用抓包数据替代 UDP 雷达，
# 无雷达也能跑通避障/导航全链路
# BUNKER_LIDAR_PCAP=/path/to/run1.pcap

# 左右轮间距（米），导航「目标点」航迹推算用，现场需实测标定
# BUNKER_WHEELBASE=0.5

# 允许的最大台阶/坑深度（米），超过则判定「不可通行」需绕行。
# BUNKER MINI 2.0 离地间隙约 0.14 m → 建议 0.07
# BUNKER_STEP_LIMIT=0.07

# ============================================================
# 网络延迟 / 断电保护（主线任务本地闭环，遥控走 TTL）
# ============================================================
# 过期 move（秒）。迟到的 kb 包超过此时延被丢弃，避免误取消 fo。
# BUNKER_FAILSAFE_MOVE_TTL=0.80
# 过期 fo/goto 等一次性指令（秒）
# BUNKER_FAILSAFE_START_TTL=5.0
# RTT 超过该秒数 → 链路 degraded（只停遥控）
# BUNKER_FAILSAFE_RTT_DEGRADED=0.50
# 无云端报文超过该秒数 → lost（等同断线）
# BUNKER_FAILSAFE_SILENCE_LOST=12.0
# BMS 电量警告 / 危急（危急且任务中 → 本地返航）
# BUNKER_FAILSAFE_SOC_WARN=20
# BUNKER_FAILSAFE_SOC_CRIT=12

# ============================================================
# 自主探路（find_object 搜索阶段：巡游 → 找目标 → 返回起点）
# ============================================================

# 探路最长时长（秒）。超过仍未找到目标 → 沿探路轨迹原路返回起点
# BUNKER_RECON_MAX_DURATION=120

# 探路最远直线距离（米）。超过仍未找到目标 → 沿探路轨迹原路返回
# BUNKER_RECON_MAX_DISTANCE=20

# ============================================================
# 机械臂「抓取完成」信号（arm_bridge/，联调/实战前启用）
# ============================================================

# 信号通道规格，逗号分隔（任选其一或多通道并存取最早者）：
#   ws                       云端 grasp_done 指令（mock_cloud 里输入 gd）
#   can:can1:0x3A1           机械臂并入底盘 socketcan 总线发帧 0x3A1（data[0]=0x01）
#   gpio:18:high             机械臂拉高 Jetson 40-pin 引脚 18（low 为低电平有效）
#   file:/tmp/grasp.sig      联调文件（写 grasped 即完成，无需硬件）
# 留空或 none = 关闭机械臂等待（机械臂就位后立即返回，旧行为）
# ARM_GRASP_SIGNAL=ws,file:/tmp/grasp.sig

# 等待机械臂抓取完成的最长秒数（超时推 grasp_timeout 事件并停车等待人工处置）
# ARM_WAIT_TIMEOUT=90
